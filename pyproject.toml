[project]
name = "netguardian"
version = "0.1.0"
description = "Evidence-based network diagnostics and monitoring"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "dnspython>=2.7,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "psycopg[binary]>=3,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2,<3",
    "streamlit>=1.41,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"integration/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
